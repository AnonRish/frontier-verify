[project]
name = "frontier-verify"
version = "0.4.0"
description = "Frontier Verify -- Phase 1 core verification fabric (reference implementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "cryptography>=42.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
triton = ["opentelemetry-sdk>=1.40", "opentelemetry-api>=1.40"]
recomputation-research = ["numpy>=1.26"]

[project.scripts]
fv = "cli.fv.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frontier_verify*", "cli*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Typer requires `typer.Option(...)` as an argument *default*, which is
# exactly the pattern flake8-bugbear's B008 exists to catch for mutable/
# expensive defaults in general. It's a false positive for this specific
# library, not a reason to disable B008 project-wide.
"cli/fv/main.py" = ["B008"]

[tool.ruff.lint]
# PYI034 wants __enter__ to return typing.Self, which needs Python 3.11+ or
# a typing_extensions dependency. We support 3.10, so returning the
# concrete class name is the correct choice here, not an oversight.
ignore = ["PYI034"]
